name: refresh-previews

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run capture-previews
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: public/previews/
      - name: commit previews
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/previews/
          git diff --cached --quiet || git commit -m "chore: refresh preview screenshots"
          git push
